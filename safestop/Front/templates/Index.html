<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width , initial-scale=1">
        {% block css %}
        <link rel="stylesheet" href="{{ url_for('static', filename='css/index.css') }}" />
        {% endblock %}
        <title>Index</title>
    </head>
    <body>
        <div class="background">
            <div class="title">
                <a class="safe">Safe</a><a class="stop">stop</a>
            </div>
            <div class="button-box">
                {% for i in feedData %}
                    <div class="button-group">
                        <div class="buttonDiv" onclick="window.location.href = '{{ url_for('feed', num=i) }}';">
                            {% if feedData[i]["name"] == "video1.mp4" %}
                                <a class="button">Cámara de prueba ({{ i }})</a>
                            {% else %}
                                <a class="button">Cámara {{ i }}</a>
                            {% endif %}
                                
                        </div>
                    </div>
                {% endfor %}
            </div>
            <div class="pilar">
                .
            </div>
        </div>
    </body>
</html>
